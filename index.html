<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divisori</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

<nav class="navbar bg-warning">
    <div class="container-fluid flex-column justify-content-center">
        <p class="navbar-brand mb-0 fw-bold h1 fs-1 text-uppercase">script javascript</p>
        <p class="navbar-brand mb-0 h1 fs-4">Una collezione di script Javascript</p>
    </div>
</nav>


<div class="row mt-3">
    <div class="col-md-4 d-flex flex-column align-items-center p-3 border border-dark-subtle">
        <h2 class="text-primary text-uppercase">cosa fa lo script</h2>
        <img src="./images/js.webp" class="img-fluid mb-3 w-75 d-none d-md-block" alt="logo js">
        <div class="alert alert-info text-center">
            <p class="mb-0">Inserisci un numero e lo script calcolerà i divisori</p>
        </div>
    </div>
    <div class="col-6 col-md-4 d-flex flex-column align-items-center p-3 border border-warning">
        <h2 class="text-primary text-uppercase">il tuo input</h2>
        <form id="formDivisori" class="w-75 d-flex flex-column gap-2">
            <input id="numero" class="form-control" type="number" step="1" placeholder="inserisci il numero">
            <button id="btn" class="btn btn-outline-dark" type="submit">Calcola</button>
        </form>
    </div>
    <div class="col-6 col-md-4 d-flex flex-column align-items-center p-3 border border-dark-subtle">
        <h2 class="text-primary text-uppercase">il risultato</h2>
        <div id="spinner" class="spinner-border text-danger"></div>
        <p id="risultato" class="mt-2 text-center w-75 p-2 bg-white"></p>
    </div>
</div>
    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
